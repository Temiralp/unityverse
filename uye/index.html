<body class="member-profile-page">
  <div class="member-profile-topbar">
    <div class="member-profile-topbar__inner">
      <a href="../form/hemen-bilgi-al-1/">Eğitimler Hakkında Bilgi Al</a>
      <a href="tel:+902128072828">0212 807 28 28</a>
      <a href="../siparis-takip/">Sipariş Takip</a>
    </div>
  </div>
  <header class="member-profile-header">
    <div class="member-profile-header__inner">
      <a class="member-profile-brand" href="../" aria-label="Unityverse Academy ana sayfa">
        <img src="../uploads/p/o/M8NILhl4t7HF.jpg?v=1701782743" alt="Unityverse Academy">
      </a>
      <a class="member-profile-home" href="../">Ana Sayfaya Dön</a>
    </div>
  </header>
  <main class="member-profile-main">
    <section class="member-profile-card" aria-live="polite">
      <div class="member-profile-loading" data-member-loading>Profil bilgileriniz yükleniyor...</div>
      <div class="member-profile-error" data-member-error hidden>Profil bilgileri yüklenemedi. Lütfen sayfayı yenileyin.</div>
      <div data-member-profile hidden>
        <div class="member-profile-card__intro">
          <div class="member-profile-avatar" data-member-initial aria-hidden="true"></div>
          <div>
            <h1 data-member-name></h1>
            <p>Üye profiliniz</p>
          </div>
        </div>
        <dl class="member-profile-details">
          <div><dt>Adınız</dt><dd data-member-first-name></dd></div>
          <div><dt>Soyadınız</dt><dd data-member-surname></dd></div>
          <div><dt>E-posta</dt><dd data-member-email></dd></div>
          <div><dt>Telefon</dt><dd data-member-phone></dd></div>
        </dl>
      </div>
    </section>
  </main>
  <footer class="member-profile-footer">
    <div class="member-profile-footer__inner">
      <p>© Unityverse Academy. Tüm hakları saklıdır.</p>
